.top-tools{display:flex;align-items:center;gap:12px;flex:none}.top-tools button{border:0;background:transparent;font-size:12px;color:var(--muted);padding:4px 0}.top-tools button[aria-pressed=true]{color:var(--blue);font-weight:700}.part-tabs{display:grid;grid-template-columns:1.45fr 1.15fr 1fr 1fr .85fr;gap:8px;margin-top:16px}.part-tab{display:flex;justify-content:center;align-items:center;gap:9px;min-height:44px;font-size:13px;line-height:1.4;border:1px solid var(--line);border-radius:9px;background:#FFFFFF60;color:var(--muted);padding:8px 12px}.part-tab.active{background:var(--blue);border-color:var(--blue);color:white}.tab-number{font-size:11px;font-weight:650;opacity:.8}.short-label{display:none}.part-picker{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px -19px #18202E40;padding:38px 46px}.part-picker[hidden],.nav[hidden]{display:none!important}.picker-intro>span{font-size:12px;font-weight:650;letter-spacing:.12em;color:var(--blue)}.picker-intro h2{font-size:34px;line-height:1.3;letter-spacing:-.035em;margin:12px 0 9px}.picker-intro p{font-size:16px;color:var(--muted);margin:0 0 25px}.part-choices{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.part-choice{grid-column:span 2;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:white;border:1px solid var(--line);border-radius:12px;padding:21px 22px;min-height:205px;transition:border-color .15s,background .15s}.part-choice:nth-last-child(-n+2){grid-column:span 3}.part-choice:hover{border-color:var(--blue);background:var(--blue-pale)}.choice-number{font-size:11px;font-weight:650;letter-spacing:.06em;color:var(--blue)}.part-choice strong{font-size:20px;line-height:1.4;letter-spacing:-.02em;margin:10px 0}.choice-question{font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:16px}.choice-meta{font-size:12px;color:var(--blue);margin-top:auto}.page-eyebrow{color:var(--blue)}html.fit .part-picker{width:1280px;height:720px;zoom:var(--s)}

<body>
<div class="app">
<header class="top"><div class="top-row"><h1 class="ttl" data-reading-map-title>논문 파트별 읽기 지도</h1><div class="top-tools"><button id="parts-home" type="button">파트 선택</button><button id="common-open" type="button" aria-pressed="false">공통 자료</button><a class="source-link" data-reading-map-source href="reading-map-template.md">작성 양식 ↗</a></div></div><nav class="part-tabs" aria-label="다섯 파트 선택"></nav></header>
<main class="stage" id="stage" aria-label="파트별로 한 페이지씩 읽는 지도"><section class="part-picker" id="part-picker" aria-label="담당 파트 선택"><div class="picker-intro"><span>FIVE PARTS · READING MAP</span><h2>담당 파트를 선택하세요</h2><p>파트를 고른 뒤 아래 이전·다음 버튼으로 질문부터 상세 근거까지 한 페이지씩 읽습니다.</p></div><div class="part-choices"></div></section><!-- READING_MAP_BODY --></main>
<nav class="nav" aria-label="페이지 이동"><button class="btn" id="prev" type="button" aria-label="이전 페이지">← 이전</button><span class="count" id="count" role="status" aria-live="polite"></span><button class="btn next" id="next" type="button" aria-label="다음 페이지">다음 →</button><select id="jump" aria-label="페이지 선택"></select><button class="btn mode" id="mode" type="button">읽기 모드</button></nav>
</div>
<script>
(() => {
  const root=document.documentElement;
  let pages=[...document.querySelectorAll('.paper-page')];
  const stage=document.getElementById('stage'),picker=document.getElementById('part-picker'),nav=document.querySelector('.nav');
  const prev=document.getElementById('prev'),next=document.getElementById('next'),jump=document.getElementById('jump'),count=document.getElementById('count'),modeButton=document.getElementById('mode');
  const parts=[
    {id:'architecture',label:'Architecture & Pre-training',short:'구조·사전학습'},
    {id:'data',label:'Data & Synthesis',short:'데이터'},
    {id:'post',label:'Post-training',short:'후학습'},
    {id:'alignment',label:'Alignment & RL',short:'정렬·RL'},
    {id:'background',label:'Background',short:'배경'}
  ];
  // Directly opening the reusable shell shows an honest, working format preview.
  // Rendered reports already contain paper pages and never use these examples.
  if(!pages.length){
    root.dataset.preview='true';
    document.title='파트별 읽기 지도 · 양식 미리보기';
    document.querySelector('.ttl').textContent=document.title;
    picker.querySelector('.picker-intro>span').textContent='FORMAT PREVIEW · 양식 미리보기';
    picker.querySelector('h2').textContent='파트별 구성을 미리 살펴보세요';
    picker.querySelector('.picker-intro p').textContent='아래 읽기 시작 버튼이나 PART 카드를 누르세요. 선택한 파트 안에서 이전·다음으로 한 페이지씩 넘길 수 있습니다.';
    const examples=[
      ['모델 구조와 사전학습은 무엇을 바꾸는가?', '블록의 입력·연산·출력, 학습 목표와 optimizer, 모델 크기·토큰 예산을 연결합니다.', '구조와 사전학습을 각각 판정하고, 계승한 기법과 새 변경을 구분합니다.'],
      ['어떤 데이터가 어떻게 학습에 들어가는가?', '출처·혼합·생성·선별·검증과 학습 단계별 데이터 단위를 연결합니다.', '문서·token·prompt-answer·선호 쌍의 단위와 공개 범위를 구분합니다.'],
      ['무엇을 target으로 삼아 모델을 학습시키는가?', '출발 모델, 학습 입력, target·loss mask와 학습 후 결과를 연결합니다.', '데이터 생성과 실제 모델 학습의 역할을 구분하고 공개된 설정만 기록합니다.'],
      ['선호와 보상은 정책에 어떻게 반영되는가?', '선호 label, reward 학습, 정책 갱신과 평가 조건을 연결합니다.', '실제 수행한 훈련과 평가를 구분하며, 미기술 내용을 미수행으로 단정하지 않습니다.'],
      ['이 논문을 읽기 위해 어떤 개념이 필요한가?', '선수 개념과 선행 원전의 필요한 범위를 본 보고서의 근거와 연결합니다.', '본문 핵심과 외부 읽기를 별도로 집계하고 필요한 갈래를 선택합니다.']
    ];
    function previewPage(part,index,title,content,kind='text'){
      const page=document.createElement('section');page.className='paper-page';page.id='preview-'+part+'-'+index;
      Object.assign(page.dataset,{part,section:'양식 미리보기',pageTitle:title,kind,topic:''});
      page.innerHTML='<div class="section-heading"><span></span><h2></h2></div><div class="page-body"></div>';
      page.querySelector('h2').textContent=title;page.querySelector('.page-body').innerHTML=content;stage.append(page);
    }
    parts.forEach((part,i)=>{
      const [question,scope,boundary]=examples[i];
      previewPage(part.id,1,part.label,'<article class="part-card"><span class="part-label">내용 구성 예시 · 실제 논문 분석 아님</span><div class="part-question"><span>담당 질문</span><p>'+question+'</p></div><dl><dt>이 파트에서 읽을 것</dt><dd>'+scope+'</dd><dt>정리할 경계</dt><dd>'+boundary+'</dd><dt>다음 페이지</dt><dd>원문 근거·조건·공백을 정리하는 화면</dd></dl></article>','part');
      previewPage(part.id,2,'원문 근거에서 읽기 범위까지','<p><strong>'+part.label+'</strong>의 상세 항목은 다음 내용을 함께 보여줍니다.</p><ul><li><strong>원문 근거:</strong> 논문 버전·절·페이지·표·수식과 해당 주장의 연결</li><li><strong>설명 경로:</strong> 입력 → 연산·변경 → 출력과 다음 파트로 전달되는 내용</li><li><strong>조건과 공백:</strong> 실험 조건, 저자 설명과 추출자 해석, 미공개·확인 필요 범위</li><li><strong>읽기 계획:</strong> 필수·선택 범위, 상대 부담과 공동 참조</li></ul><p>이 화면은 양식의 예시입니다. 실제 추출 시에는 논문에서 확인한 근거로 채웁니다.</p>');
    });
    previewPage('common',1,'공통 자료와 검토 기록','<p>다섯 파트가 함께 참고하는 내용을 모으는 공간입니다.</p><ul><li>보고서의 정확한 판본과 실제 확인한 범위</li><li>파트 간 전달물과 공통 읽기</li><li>전체 집계, 중복 범위와 역할 조정 제안</li><li>발표자료 인계와 실제 재검토 기록</li></ul><p>상단의 <strong>작성 양식</strong>에서 재사용할 Markdown 구성을 확인할 수 있습니다.</p>');
    pages=[...document.querySelectorAll('.paper-page')];
  }
  const groups=Object.fromEntries([...parts.map(p=>p.id),'common'].map(id=>[id,pages.filter(p=>p.dataset.part===id)]));
  const label=id=>parts.find(p=>p.id===id)?.label||'공통 자료';
  const tabs=document.querySelector('.part-tabs'),choices=document.querySelector('.part-choices');
  const mq=matchMedia('(min-width:820px) and (min-aspect-ratio:11/10)');
  let activePart='',current=0,mode='auto';const tableHints=[];
  parts.forEach((part,i)=>{
    const button=document.createElement('button');button.type='button';button.dataset.part=part.id;button.className='part-tab';button.title=part.label;button.setAttribute('aria-label',part.label);
    const number=document.createElement('span');number.className='tab-number';number.textContent=String(i+1).padStart(2,'0');
    const full=document.createElement('span');full.className='full-label';full.textContent=part.label;
    const short=document.createElement('span');short.className='short-label';short.textContent=part.short;button.append(number,full,short);button.addEventListener('click',()=>openPart(part.id));tabs.append(button);
    const choice=document.createElement('button');choice.type='button';choice.className='part-choice';choice.dataset.part=part.id;
    const n=document.createElement('span');n.className='choice-number';n.textContent='PART '+String(i+1).padStart(2,'0');
    const h=document.createElement('strong');h.textContent=part.label;
    const intro=groups[part.id].find(p=>p.dataset.kind==='part');
    const q=document.createElement('span');q.className='choice-question';q.textContent=intro?.querySelector('.part-question p')?.textContent||intro?.querySelector('.page-body li')?.textContent.replace(/^설명할 질문:\s*/,'')||intro?.querySelector('.page-body>p')?.textContent||'담당 질문과 원문 근거를 읽습니다.';
    const meta=document.createElement('span');meta.className='choice-meta';meta.textContent=groups[part.id].length+' 페이지  ↗';
    choice.append(n,h,q,meta);choice.addEventListener('click',()=>openPart(part.id));choices.append(choice);
  });
  pages.forEach(page=>{
    const eyebrow=document.createElement('div');eyebrow.className='page-eyebrow';eyebrow.textContent=label(page.dataset.part)+' · '+page.dataset.section;page.prepend(eyebrow);
    const heading=page.querySelector('h2');if(heading)heading.tabIndex=-1;
    const hint=document.createElement('p');hint.className='page-overflow-hint';hint.textContent='페이지 안에서 아래로 읽거나, 읽기 모드로 확대해 보세요.';hint.hidden=true;page.append(hint);
  });
  for(const table of document.querySelectorAll('.page-body table')){
    const wrap=document.createElement('div');wrap.className='table-scroll';wrap.tabIndex=0;wrap.dataset.horizontalScroll='true';wrap.setAttribute('role','region');wrap.setAttribute('aria-label','근거 표 · 가로 스크롤');table.before(wrap);wrap.append(table);
    const hint=document.createElement('p');hint.className='scroll-hint';hint.textContent='↔ 표를 좌우로 밀어 나머지 열을 확인하세요.';wrap.after(hint);tableHints.push({wrap,hint});
  }
  for(const pre of document.querySelectorAll('pre')){pre.tabIndex=0;pre.dataset.horizontalScroll='true'}
  function hints(){
    const page=groups[activePart]?.[current];if(!page)return;
    for(const {wrap,hint} of tableHints)if(page.contains(wrap))hint.hidden=wrap.scrollWidth<=wrap.clientWidth+2;
    const body=page.querySelector('.page-body'),hint=page.querySelector('.page-overflow-hint');hint.hidden=true;
    if(root.classList.contains('fit')&&body.scrollHeight>body.clientHeight+2)hint.hidden=false;
  }
  function layout(){
    const fit=mode==='slide'||(mode==='auto'&&mq.matches);root.classList.toggle('fit',fit);
    modeButton.textContent=fit?'읽기 모드':'슬라이드 모드';modeButton.setAttribute('aria-pressed',String(!fit));
    if(fit){const r=stage.getBoundingClientRect();root.style.setProperty('--s',Math.max(.1,Math.min((r.width-36)/1280,(r.height-12)/720,1)).toFixed(4))}hints();
  }
  function updatePart(){
    document.body.dataset.activePart=activePart;
    for(const button of tabs.querySelectorAll('button')){const on=button.dataset.part===activePart;button.classList.toggle('active',on);button.setAttribute('aria-pressed',String(on))}
    document.getElementById('common-open').setAttribute('aria-pressed',String(activePart==='common'));
    jump.replaceChildren();
    if(activePart){
      groups[activePart].forEach((page,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=(i+1)+'. '+page.dataset.pageTitle;jump.append(o)});
      jump.setAttribute('aria-label',label(activePart)+' 페이지 선택');
    }else{
      parts.forEach((part,i)=>{const o=document.createElement('option');o.value=part.id;o.textContent='PART '+String(i+1).padStart(2,'0')+' · '+part.label;o.disabled=!groups[part.id].length;jump.append(o)});
      jump.value=parts.find(part=>groups[part.id].length)?.id||'';
      jump.setAttribute('aria-label','읽을 파트 선택');
    }
  }
  function hidePages(){pages.forEach(page=>{page.hidden=true;page.classList.remove('on');page.inert=true;page.setAttribute('aria-hidden','true')})}
  function landing(updateHash=true){
    activePart='';current=0;hidePages();picker.hidden=false;picker.inert=false;nav.hidden=false;updatePart();
    prev.disabled=true;next.disabled=!jump.value;next.textContent='읽기 시작 →';count.textContent='파트 선택';
    if(updateHash)try{history.replaceState(null,'','#parts')}catch(_){}layout();window.scrollTo({top:0,behavior:'instant'});
  }
  function show(index,updateHash=true,target=null){
    const group=groups[activePart]||[];if(!group.length){landing(updateHash);return}
    const old=document.querySelector('.paper-page.on'),oldFocus=old?.contains(document.activeElement);
    current=Math.max(0,Math.min(group.length-1,Number.isFinite(index)?Math.trunc(index):0));hidePages();picker.hidden=true;picker.inert=true;nav.hidden=false;
    const page=group[current];page.hidden=false;page.inert=false;page.classList.add('on');page.setAttribute('aria-hidden','false');page.setAttribute('aria-label',label(activePart)+' · '+(current+1)+' / '+group.length+' · '+page.dataset.pageTitle);
    page.querySelector('.section-heading>span').textContent=String(current+1).padStart(2,'0');
    count.textContent=(current+1)+' / '+group.length;prev.disabled=current===0;next.disabled=current===group.length-1;next.textContent='다음 →';jump.value=String(current);
    page.querySelector('.page-body').scrollTop=0;
    if(oldFocus)page.querySelector('h2')?.focus({preventScroll:true});
    if(updateHash)try{history.replaceState(null,'','#'+page.id)}catch(_){}layout();
    if(!root.classList.contains('fit'))window.scrollTo({top:0,behavior:'instant'});
    if(target&&page.contains(target))requestAnimationFrame(()=>{if(target.offsetTop>page.offsetTop+200)target.scrollIntoView({block:'start',behavior:'instant'})});
  }
  function openPart(id,updateHash=true){
    if(!groups[id]?.length){landing(updateHash);return}activePart=id;updatePart();show(0,false);
    if(updateHash)try{history.replaceState(null,'','#part-'+id)}catch(_){}
  }
  function openPage(page,target=null){activePart=page.dataset.part;updatePart();show(groups[activePart].indexOf(page),false,target)}
  function fromHash(){
    let id;try{id=decodeURIComponent(location.hash.slice(1))}catch(_){id=''}
    if(!id||id==='parts'){landing(false);return}
    if(id.startsWith('part-')&&groups[id.slice(5)]){openPart(id.slice(5),false);return}
    const alias=/^s(\d+)$/.exec(id);if(alias&&pages[Number(alias[1])-1]){openPage(pages[Number(alias[1])-1]);return}
    const target=document.getElementById(id),page=target?.closest('.paper-page');if(page)openPage(page,target);else landing(false);
  }
  document.getElementById('parts-home').addEventListener('click',()=>landing());
  document.getElementById('common-open').addEventListener('click',()=>openPart('common'));
  prev.addEventListener('click',()=>show(current-1));
  next.addEventListener('click',()=>activePart?show(current+1):openPart(jump.value));
  jump.addEventListener('change',()=>activePart?show(Number(jump.value)):openPart(jump.value));
  modeButton.addEventListener('click',()=>{mode=root.classList.contains('fit')?'read':'slide';layout()});
  document.addEventListener('click',event=>{
    const link=event.target.closest('a[href^="#"]');if(!link||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
    let target;try{target=document.getElementById(decodeURIComponent(link.hash.slice(1)))}catch(_){return}if(!target?.closest('.paper-page'))return;
    event.preventDefault();try{history.pushState(null,'',link.hash)}catch(_){}fromHash();
  });
  document.addEventListener('keydown',event=>{
    if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
    const tag=event.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||event.target.isContentEditable)return;
    if(!activePart){if(['ArrowRight','PageDown'].includes(event.key)){event.preventDefault();openPart(jump.value)}return}
    const horizontal=event.target.closest('[data-horizontal-scroll]');if(horizontal&&horizontal.scrollWidth>horizontal.clientWidth+2&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    let target;if(['ArrowRight','PageDown'].includes(event.key))target=current+1;else if(['ArrowLeft','PageUp'].includes(event.key))target=current-1;else if(event.key==='Home')target=0;else if(event.key==='End')target=groups[activePart].length-1;else if(event.key===' '&&root.classList.contains('fit')&&!['BUTTON','A','SUMMARY'].includes(tag))target=current+1;
    if(target!==undefined){event.preventDefault();show(target)}
  });
  window.addEventListener('hashchange',fromHash);window.addEventListener('popstate',fromHash);
  let raf;window.addEventListener('resize',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(layout)});if(mq.addEventListener)mq.addEventListener('change',layout);
  fromHash();if(document.fonts?.ready)document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
